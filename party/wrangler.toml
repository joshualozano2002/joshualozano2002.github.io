name = "draft-fight-party"
main = "worker.js"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# One object per Christmas list. Strongly consistent, unlike KV, so a gift
# claim is visible to every other shopper the moment it is saved.
[[durable_objects.bindings]]
name = "GIFTS"
class_name = "Gifts"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Gifts"]

[[kv_namespaces]]
binding = "TTS"
id = "4ba2b4967b90424c94dbc112e7416b10"
