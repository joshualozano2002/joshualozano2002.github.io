name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # BASE_PATH must match how the site is served. For a project page this is
      # /<repo>/. If you move to a user page or custom domain, set it to /.
      # Project page (current). Serves at /<repo>/ on github.io.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Custom domain: delete the step above, uncomment this one, and add
      # public/CNAME containing the bare domain (no protocol, no slash).
      # - run: npm run build
      #   env:
      #     BASE_PATH: /
      #     VITE_SITE_ORIGIN: https://joshualozano.dev

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
